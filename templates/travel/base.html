{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Travel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<nav style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 25px;
    background: rgba(0,0,0,0.4);
    color:white;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    backdrop-filter: blur(5px);
">
    
    <h4>🚗 Let's Travel</h4>

    <div>
        {% if user.is_authenticated %}
            <span style="margin-right:10px;">Hello, {{ user.username }}</span>

            <a href="/logout/" style="color:white; text-decoration:none; background:red; padding:5px 10px; border-radius:5px;">
                Logout
            </a>

            {% if user.is_staff %}
                <a href="/admin/" style="margin-left:10px; color:white;">Admin</a>
            {% endif %}

        {% else %}
            <a href="/login/" style="color:white; margin-right:10px;">Login</a>
            <a href="/signup/" style="color:white;">Signup</a>
        {% endif %}
    </div>

</nav>
{% block content %}
{% endblock %}

</body>
</html>
