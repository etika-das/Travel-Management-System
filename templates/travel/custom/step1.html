<!DOCTYPE html>
<html>
<head>
    <title>Select Destination</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 30px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .content {
            padding: 15px;
        }

        .content h3 {
            margin: 0;
            font-size: 18px;
            color: #111;
        }

        .content p {
            font-size: 13px;
            color: #666;
            margin: 8px 0;
        }

        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background: #007bff;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
        }

        .btn:hover {
            background: #0056d2;
        }
    </style>
</head>

<body>

<h2>Choose Your Destination</h2>

<div class="container">

    <!-- 🔥 DJANGO DYNAMIC PART STARTS HERE -->

    {% for d in destinations %}
    <div class="card">
        

        <div class="content">
            <h3>{{ d.name }}</h3>
            

            <a class="btn" href="{% url 'custom_trip_step2' d.id %}">
                Select
            </a>
        </div>
    </div>
    {% endfor %}

    <!-- 🔥 DJANGO DYNAMIC PART ENDS HERE -->

</div>

</body>
</html>
