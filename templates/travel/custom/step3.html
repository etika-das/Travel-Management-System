<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Enter Rooms</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #0f172a, #1e293b);
}

.container{
    width:420px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    text-align:center;
}

h2{
    color:white;
    font-size:28px;
    margin-bottom:25px;
    letter-spacing:1px;
}

label{
    display:block;
    text-align:left;
    color:#cbd5e1;
    margin-bottom:10px;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:none;
    outline:none;
    margin-bottom:25px;
    font-size:16px;
}

input:focus{
    box-shadow:0 0 0 2px #3b82f6;
}

button{
    width:100%;
    padding:14px;
    background: linear-gradient(90deg, #2563eb, #1d4ed8);
    border:none;
    color:white;
    font-size:16px;
    font-weight:600;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.03);
    background: linear-gradient(90deg, #1d4ed8, #1e40af);
}

.note{
    font-size:12px;
    color:#94a3b8;
    margin-top:15px;
}

</style>
</head>

<body>

<div class="container">

    <h2>Trip Details</h2>
    
    <form method="POST" action="{% url 'custom_trip_step4' %}">

        {% csrf_token %}

        <label>Rooms</label>
        <input type="number" name="rooms" min="1" placeholder="Enter number of rooms" required>
         <label>Number of People</label>
         <input type="number" name="people" min="1" required>

        <label>Start Date</label>
        <input type="date" name="start_date" required>

        <label>End Date</label>
        <input type="date" name="end_date" required>

        <button type="submit">Continue</button>

    </form>

    <div class="note">
        Choose carefully — more rooms may increase total cost
    </div>

</div>

</body>
</html>
